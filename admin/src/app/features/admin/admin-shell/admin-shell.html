<div class="admin-shell flex h-full overflow-hidden bg-background text-foreground">
  <aside
    class="admin-shell-sidebar hidden h-full shrink-0 overflow-hidden border-r border-border bg-card transition-[width] duration-200 lg:block"
    [class.admin-shell-sidebar-collapsed]="sidebarCollapsed()"
    aria-label="Sidebar"
  >
    <app-admin-sidebar class="block h-full w-full" [compact]="sidebarCollapsed()" />
  </aside>

  <hlm-sheet
    side="left"
    [state]="mobileSidebarState()"
    (stateChanged)="onMobileSidebarStateChange($event)"
  >
    <hlm-sheet-content
      *hlmSheetPortal="let ctx"
      [showCloseButton]="false"
      class="w-full max-w-none gap-0 border-0 p-0 sm:max-w-sm"
    >
      <app-admin-sidebar
        class="block h-full min-h-dvh w-full"
        [showCloseButton]="true"
        (navigated)="closeMobileSidebar()"
        (closed)="closeMobileSidebar()"
      />
    </hlm-sheet-content>
  </hlm-sheet>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden">
    <app-admin-shell-header
      [sidebarOpen]="sidebarIsOpen()"
      (toggleSidebar)="toggleSidebar()"
      class="w-full shrink-0"
    />
    <main class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto overscroll-contain p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
