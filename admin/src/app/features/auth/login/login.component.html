<main class="grid min-h-dvh place-items-center bg-background px-4 py-8 text-foreground sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-border bg-card p-5 shadow-lg sm:p-7"
    aria-labelledby="login-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary font-extrabold text-primary-foreground"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary">Portfolio Admin</p>
        <h1 id="login-title" class="m-0 text-3xl font-bold leading-tight text-foreground">
          Admin login
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="login-email" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">Email</span>
        </label>
        <div class="relative">
          <ng-icon
            hlm
            size="sm"
            name="lucideMail"
            class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted-foreground"
          />
          <input
            hlmInput
            class="auth-input w-full pl-9"
            id="login-email"
            type="email"
          formControlName="email"
          autocomplete="email"
          [forceInvalid]="hasFieldError('email')"
          [attr.aria-invalid]="hasFieldError('email')"
          aria-describedby="login-email-help"
        />
        </div>
        <small id="login-email-help" class="auth-help">
          {{ fieldError('email') }}
        </small>
      </div>

      <div class="grid gap-2">
        <label for="login-password" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">Password</span>
        </label>
        <div class="relative">
          <input
            hlmInput
            class="auth-input w-full pr-12"
            id="login-password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [forceInvalid]="hasFieldError('password')"
            [attr.aria-invalid]="hasFieldError('password')"
            aria-describedby="login-password-help"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-muted-foreground transition-colors hover:bg-muted hover:text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <ng-icon
              hlm
              size="sm"
              [name]="isPasswordVisible() ? 'lucideEyeOff' : 'lucideEye'"
            />
          </button>
        </div>
        <small id="login-password-help" class="auth-help">
          {{ fieldError('password') }}
        </small>
      </div>

      <div class="flex items-center gap-2.5">
        <hlm-checkbox inputId="login-remember-me" formControlName="rememberMe" />
        <label for="login-remember-me" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">Remember me</span>
        </label>
      </div>

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <button hlmBtn type="submit" class="w-full justify-center" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <hlm-spinner aria-label="Logging in" />
        } @else {
          <ng-icon hlm size="sm" name="lucideLogIn" />
        }
        Login
      </button>

      <div class="grid gap-2 text-center text-sm font-bold text-muted-foreground">
        <a routerLink="/forgot-password" class="text-primary no-underline hover:underline">
          Forgot password?
        </a>
        @if (registerEnabled()) {
          <a routerLink="/register" class="text-primary no-underline hover:underline">
            Create an account
          </a>
        }
      </div>
    </form>
  </section>
</main>
