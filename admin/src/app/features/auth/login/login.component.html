<main class="grid min-h-dvh place-items-center bg-surface-50 px-4 py-8 text-surface-950 sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-surface-200 bg-surface-0 p-5 shadow-lg sm:p-7"
    aria-labelledby="login-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary-500 font-extrabold text-primary-contrast"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary-700">Portfolio Admin</p>
        <h1 id="login-title" class="m-0 text-3xl font-bold leading-tight text-surface-950">
          Admin login
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="login-email" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Email</span>
        </label>
        <input
          pInputText
          class="auth-input w-full"
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.p-invalid]="hasFieldError('email')"
          [attr.aria-invalid]="hasFieldError('email')"
          aria-describedby="login-email-help"
        />
        <small id="login-email-help" class="auth-help">
          {{ fieldError('email') }}
        </small>
      </div>

      <div class="grid gap-2">
        <label for="login-password" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Password</span>
        </label>
        <div class="relative">
          <input
            pInputText
            class="auth-input w-full pr-12"
            id="login-password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [class.p-invalid]="hasFieldError('password')"
            [attr.aria-invalid]="hasFieldError('password')"
            aria-describedby="login-password-help"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-800 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <i
              class="pi"
              [class.pi-eye]="!isPasswordVisible()"
              [class.pi-eye-slash]="isPasswordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <small id="login-password-help" class="auth-help">
          {{ fieldError('password') }}
        </small>
      </div>

      <div class="flex items-center gap-2.5">
        <p-checkbox inputId="login-remember-me" formControlName="rememberMe" [binary]="true" />
        <label for="login-remember-me" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Remember me</span>
        </label>
      </div>

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <p-button
        type="submit"
        label="Login"
        icon="pi pi-sign-in"
        class="w-full"
        styleClass="w-full justify-center"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
      />

      <div class="grid gap-2 text-center text-sm font-bold text-surface-600">
        <a routerLink="/forgot-password" class="text-primary-700 no-underline hover:underline">
          Forgot password?
        </a>
        @if (registerEnabled()) {
          <a routerLink="/register" class="text-primary-700 no-underline hover:underline">
            Create an account
          </a>
        }
      </div>
    </form>
  </section>
</main>
