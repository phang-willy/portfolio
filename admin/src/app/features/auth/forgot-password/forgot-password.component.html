<main class="grid min-h-dvh place-items-center bg-background px-4 py-8 text-foreground sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-border bg-card p-5 shadow-lg sm:p-7"
    aria-labelledby="forgot-password-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary font-extrabold text-primary-foreground"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary">Portfolio Admin</p>
        <h1 id="forgot-password-title" class="m-0 text-3xl font-bold leading-tight text-foreground">
          Forgot password
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="forgotPasswordForm" (ngSubmit)="submitForgotPassword()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="forgot-password-email" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">Email</span>
        </label>
        <div class="relative">
          <ng-icon
            hlm
            size="sm"
            name="lucideMail"
            class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted-foreground"
          />
          <input
            hlmInput
            class="auth-input w-full pl-9"
            id="forgot-password-email"
            type="email"
          formControlName="email"
          autocomplete="email"
          [forceInvalid]="hasEmailError()"
          [attr.aria-invalid]="hasEmailError()"
        />
        </div>
        <small class="auth-help">{{ emailError() }}</small>
      </div>

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <button hlmBtn type="submit" class="w-full justify-center" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <hlm-spinner aria-label="Sending reset link" />
        } @else {
          <ng-icon hlm size="sm" name="lucideMail" />
        }
        Send reset link
      </button>

      <a routerLink="/login" class="text-center text-sm font-bold text-primary no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
