<main class="grid min-h-dvh place-items-center bg-surface-50 px-4 py-8 text-surface-950 sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-surface-200 bg-surface-0 p-5 shadow-lg sm:p-7"
    aria-labelledby="forgot-password-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary-500 font-extrabold text-primary-contrast"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary-700">Portfolio Admin</p>
        <h1 id="forgot-password-title" class="m-0 text-3xl font-bold leading-tight text-surface-950">
          Forgot password
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="forgotPasswordForm" (ngSubmit)="submitForgotPassword()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="forgot-password-email" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Email</span>
        </label>
        <input
          pInputText
          class="auth-input w-full"
          id="forgot-password-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.p-invalid]="hasEmailError()"
          [attr.aria-invalid]="hasEmailError()"
        />
        <small class="auth-help">{{ emailError() }}</small>
      </div>

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <p-button
        type="submit"
        label="Send reset link"
        icon="pi pi-envelope"
        class="w-full"
        styleClass="w-full justify-center"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
      />

      <a routerLink="/login" class="text-center text-sm font-bold text-primary-700 no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
