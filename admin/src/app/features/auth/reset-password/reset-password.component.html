<main class="grid min-h-dvh place-items-center bg-background px-4 py-8 text-foreground sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-border bg-card p-5 shadow-lg sm:p-7"
    aria-labelledby="reset-password-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary font-extrabold text-primary-foreground"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary">Portfolio Admin</p>
        <h1 id="reset-password-title" class="m-0 text-3xl font-bold leading-tight text-foreground">
          Reset password
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="resetPasswordForm" (ngSubmit)="submitResetPassword()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="reset-password" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">New password</span>
        </label>
        <div class="relative">
          <input
            hlmInput
            class="auth-input w-full pr-12"
            id="reset-password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            [forceInvalid]="hasFieldError('password')"
            [attr.aria-invalid]="hasFieldError('password')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-muted-foreground transition-colors hover:bg-muted hover:text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <ng-icon
              hlm
              size="sm"
              [name]="isPasswordVisible() ? 'lucideEyeOff' : 'lucideEye'"
            />
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('password') }}
        </small>
      </div>

      <div class="grid gap-2">
        <label for="reset-confirm-password" class="cursor-pointer font-bold text-foreground">
          <span class="text-sm">Confirm password</span>
        </label>
        <div class="relative">
          <input
            hlmInput
            class="auth-input w-full pr-12"
            id="reset-confirm-password"
            [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [forceInvalid]="hasFieldError('confirmPassword')"
            [attr.aria-invalid]="hasFieldError('confirmPassword')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-muted-foreground transition-colors hover:bg-muted hover:text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"
            [attr.aria-label]="
              isConfirmPasswordVisible() ? 'Hide password' : 'Show password'
            "
            (click)="toggleConfirmPasswordVisibility()"
          >
            <ng-icon
              hlm
              size="sm"
              [name]="isConfirmPasswordVisible() ? 'lucideEyeOff' : 'lucideEye'"
            />
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('confirmPassword') }}
        </small>
      </div>

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <button
        hlmBtn
        type="submit"
        class="w-full justify-center"
        [disabled]="isSubmitting() || !token"
      >
        @if (isSubmitting()) {
          <hlm-spinner aria-label="Resetting password" />
        } @else {
          <ng-icon hlm size="sm" name="lucideKey" />
        }
        Reset password
      </button>

      <a routerLink="/login" class="text-center text-sm font-bold text-primary no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
