<main class="grid min-h-dvh place-items-center bg-surface-50 px-4 py-8 text-surface-950 sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-surface-200 bg-surface-0 p-5 shadow-lg sm:p-7"
    aria-labelledby="reset-password-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary-500 font-extrabold text-primary-contrast"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary-700">Portfolio Admin</p>
        <h1 id="reset-password-title" class="m-0 text-3xl font-bold leading-tight text-surface-950">
          Reset password
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="resetPasswordForm" (ngSubmit)="submitResetPassword()">
      <app-auth-honeypot-field />

      <div class="grid gap-2">
        <label for="reset-password" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">New password</span>
        </label>
        <div class="relative">
          <input
            pInputText
            class="auth-input w-full pr-12"
            id="reset-password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            [class.p-invalid]="hasFieldError('password')"
            [attr.aria-invalid]="hasFieldError('password')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-800 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <i
              class="pi"
              [class.pi-eye]="!isPasswordVisible()"
              [class.pi-eye-slash]="isPasswordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('password') }}
        </small>
      </div>

      <div class="grid gap-2">
        <label for="reset-confirm-password" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Confirm password</span>
        </label>
        <div class="relative">
          <input
            pInputText
            class="auth-input w-full pr-12"
            id="reset-confirm-password"
            [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [class.p-invalid]="hasFieldError('confirmPassword')"
            [attr.aria-invalid]="hasFieldError('confirmPassword')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-800 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            [attr.aria-label]="
              isConfirmPasswordVisible() ? 'Hide password' : 'Show password'
            "
            (click)="toggleConfirmPasswordVisibility()"
          >
            <i
              class="pi"
              [class.pi-eye]="!isConfirmPasswordVisible()"
              [class.pi-eye-slash]="isConfirmPasswordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('confirmPassword') }}
        </small>
      </div>

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <p-button
        type="submit"
        label="Reset password"
        icon="pi pi-key"
        class="w-full"
        styleClass="w-full justify-center"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting() || !token"
      />

      <a routerLink="/login" class="text-center text-sm font-bold text-primary-700 no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
