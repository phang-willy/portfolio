<main class="grid min-h-dvh place-items-center bg-surface-50 px-4 py-8 text-surface-950 sm:px-6">
  <section
    class="w-full max-w-130 rounded-lg border border-surface-200 bg-surface-0 p-5 shadow-lg sm:p-7"
    aria-labelledby="register-title"
  >
    <div class="mb-6 flex items-center gap-3.5">
      <span
        class="grid size-11 place-items-center rounded-lg bg-primary-500 font-extrabold text-primary-contrast"
        aria-hidden="true"
        >A</span
      >
      <div>
        <p class="mb-1 text-xs font-extrabold uppercase text-primary-700">Portfolio Admin</p>
        <h1 id="register-title" class="m-0 text-3xl font-bold leading-tight text-surface-950">
          Register
        </h1>
      </div>
    </div>

    <form class="grid gap-4" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
      <app-auth-honeypot-field />

      <div class="grid grid-cols-2 gap-3 max-sm:grid-cols-1">
        <div class="grid gap-2">
          <label for="register-firstname" class="cursor-pointer font-bold text-surface-800">
            <span class="text-sm">Firstname</span>
          </label>
          <input
            pInputText
            class="auth-input w-full"
            id="register-firstname"
            type="text"
            formControlName="firstname"
            autocomplete="given-name"
            [class.p-invalid]="hasFieldError('firstname')"
            [attr.aria-invalid]="hasFieldError('firstname')"
          />
          <small class="auth-help">
            {{ fieldError('firstname') }}
          </small>
        </div>

        <div class="grid gap-2">
          <label for="register-lastname" class="cursor-pointer font-bold text-surface-800">
            <span class="text-sm">Lastname</span>
          </label>
          <input
            pInputText
            class="auth-input w-full"
            id="register-lastname"
            type="text"
            formControlName="lastname"
            autocomplete="family-name"
            [class.p-invalid]="hasFieldError('lastname')"
            [attr.aria-invalid]="hasFieldError('lastname')"
          />
          <small class="auth-help">
            {{ fieldError('lastname') }}
          </small>
        </div>
      </div>

      <div class="grid gap-2">
        <label for="register-email" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Email</span>
        </label>
        <input
          pInputText
          class="auth-input w-full"
          id="register-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [class.p-invalid]="hasFieldError('email')"
          [attr.aria-invalid]="hasFieldError('email')"
        />
        <small class="auth-help">{{ fieldError('email') }}</small>
      </div>

      <div class="grid gap-2">
        <label for="register-password" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Password</span>
        </label>
        <div class="relative">
          <input
            pInputText
            class="auth-input w-full pr-12"
            id="register-password"
            [type]="isPasswordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            [class.p-invalid]="hasFieldError('password')"
            [attr.aria-invalid]="hasFieldError('password')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-800 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePasswordVisibility()"
          >
            <i
              class="pi"
              [class.pi-eye]="!isPasswordVisible()"
              [class.pi-eye-slash]="isPasswordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('password') }}
        </small>
      </div>

      <div class="grid gap-2">
        <label for="register-confirm-password" class="cursor-pointer font-bold text-surface-800">
          <span class="text-sm">Confirm password</span>
        </label>
        <div class="relative">
          <input
            pInputText
            class="auth-input w-full pr-12"
            id="register-confirm-password"
            [type]="isConfirmPasswordVisible() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [class.p-invalid]="hasFieldError('confirmPassword')"
            [attr.aria-invalid]="hasFieldError('confirmPassword')"
          />
          <button
            type="button"
            class="absolute right-1 top-1/2 grid size-10 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-transparent text-surface-500 transition-colors hover:bg-surface-100 hover:text-surface-800 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            [attr.aria-label]="
              isConfirmPasswordVisible() ? 'Hide password' : 'Show password'
            "
            (click)="toggleConfirmPasswordVisibility()"
          >
            <i
              class="pi"
              [class.pi-eye]="!isConfirmPasswordVisible()"
              [class.pi-eye-slash]="isConfirmPasswordVisible()"
              aria-hidden="true"
            ></i>
          </button>
        </div>
        <small class="auth-help">
          {{ fieldError('confirmPassword') }}
        </small>
      </div>

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <p-button
        type="submit"
        label="Register"
        icon="pi pi-user-plus"
        class="w-full"
        styleClass="w-full justify-center"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting()"
      />

      <a routerLink="/login" class="text-center text-sm font-bold text-primary-700 no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
