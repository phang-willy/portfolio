<main class="grid min-h-dvh place-items-center bg-surface-50 px-4 py-8 text-surface-950 sm:px-6">
  <section
    class="w-full max-w-120 rounded-lg border border-surface-200 bg-surface-0 p-5 text-center shadow-lg sm:p-7"
    aria-labelledby="verify-title"
  >
    <div class="mx-auto mb-5 grid size-12 place-items-center rounded-lg bg-primary-100 text-primary-700">
      <i class="pi pi-check-circle" aria-hidden="true"></i>
    </div>
    <p class="m-0 text-xs font-extrabold uppercase text-primary-700">Portfolio Admin</p>
    <h1 id="verify-title" class="m-0 mt-2 text-3xl font-bold leading-tight text-surface-950">
      Verify email
    </h1>
    <p class="mb-5 mt-2 text-surface-600">
      The verification starts automatically when this page opens.
    </p>

    <form class="grid gap-4" [formGroup]="verifyForm" (ngSubmit)="submitVerifyEmail()">
      <app-auth-honeypot-field />

      @if (successMessage()) {
        <p class="auth-feedback auth-feedback-success">
          {{ successMessage() }}. Redirecting...
        </p>
      }

      @if (errorMessage()) {
        <p class="auth-feedback auth-feedback-error">
          {{ errorMessage() }}
        </p>
      }

      <p-button
        type="submit"
        label="Verify email"
        icon="pi pi-check"
        class="w-full"
        styleClass="w-full justify-center"
        [loading]="isSubmitting()"
        [disabled]="isSubmitting() || !token || !!successMessage()"
      />

      <a routerLink="/login" class="text-sm font-bold text-primary-700 no-underline hover:underline">
        Back to login
      </a>
    </form>
  </section>
</main>
