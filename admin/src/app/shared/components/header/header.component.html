<header
  class="flex min-h-16 items-center justify-between gap-4 border-b border-border bg-card px-5 text-foreground max-sm:flex-col max-sm:items-stretch max-sm:py-4"
>
  <a routerLink="/admin" class="flex items-center gap-3 text-foreground no-underline">
    <span
      class="grid size-10 place-items-center rounded-lg bg-primary font-extrabold text-primary-foreground"
      aria-hidden="true"
      >A</span
    >
    <span class="grid">
      <strong>Portfolio Admin</strong>
      <small class="font-bold text-muted-foreground">Control panel</small>
    </span>
  </a>

  <div
    class="flex items-center justify-end gap-3 max-sm:justify-between"
    aria-label="Authenticated user"
  >
    @if (currentUser$ | async; as user) {
      <div class="grid text-right max-sm:text-left">
        <strong>{{ user.firstname }} {{ user.lastname }}</strong>
        <small class="font-bold text-muted-foreground">{{ user.email }} · {{ user.role }}</small>
      </div>
    }

    <button
      hlmBtn
      type="button"
      variant="outline"
      [disabled]="isLoggingOut()"
      (click)="logout()"
    >
      @if (isLoggingOut()) {
        <hlm-spinner aria-label="Logging out" />
      } @else {
        <ng-icon hlm size="sm" name="lucideLogOut" />
      }
      Logout
    </button>

    <div>
      <app-theme-toggle />
    </div>
  </div>
</header>
