<a
  routerLink="/notification"
  routerLinkActive="bg-muted text-foreground"
  ariaCurrentWhenActive="page"
  class="relative inline-flex size-10 cursor-pointer items-center justify-center rounded-md border border-border bg-card text-foreground no-underline shadow-lg transition-colors hover:bg-muted hover:text-foreground focus:outline-none focus:ring-2 focus:ring-primary/30"
  [attr.aria-label]="ariaLabel()"
>
  <ng-icon hlm size="sm" name="lucideBell" />
  @if (badgeLabel(); as label) {
    <span
      class="absolute -top-1.5 -right-1.5 grid h-5 min-w-5 place-items-center rounded-full bg-red-600 px-1 text-[10px] font-bold leading-none text-white"
      aria-hidden="true"
    >
      {{ label }}
    </span>
  }
</a>
