name: Deploy production

# After a merged pull request from pre-prod into main, wait until CI is green,
# then update the server checkout and recreate the production Compose stack.
#
# Required repository secrets:
#   PROD_HOST, PROD_USER, PROD_SSH_KEY, PROD_PATH
# Optional:
#   PROD_SSH_PORT (default 22), PROD_KNOWN_HOSTS
# The SSH user must be able to run Docker. Create .env once in PROD_PATH
# before the first deploy. That file and the database volume are not replaced.

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Update server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Accept only a merged pull request from pre-prod
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=0
          for _ in 1 2 3 4 5 6; do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .head.ref == "pre-prod")] | length')"
            if [ "$count" != "0" ]; then
              break
            fi
            sleep 10
          done

          if [ "$count" = "0" ]; then
            echo "This push is not a merged pull request from pre-prod to main. Skipping deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merged pull request from pre-prod to main detected."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Wait for CI
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1500))
          while [ "$SECONDS" -lt "$deadline" ]; do
            line="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=1" \
              --jq '[.workflow_runs[0].status // "", .workflow_runs[0].conclusion // ""] | @tsv')"
            status="${line%%$'\t'*}"
            conclusion=""
            if [[ "$line" == *$'\t'* ]]; then
              conclusion="${line#*$'\t'}"
            fi

            if [ "$conclusion" = "success" ]; then
              echo "CI succeeded."
              exit 0
            fi
            if [ -n "$conclusion" ]; then
              echo "CI conclusion: ${conclusion}"
              exit 1
            fi

            echo "CI status: ${status:-not started yet}"
            sleep 30
          done

          echo "Timed out waiting for CI on ${GITHUB_SHA}."
          exit 1

      - name: Checkout deploy script
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@v6

      - name: Require deploy secrets
        if: steps.gate.outputs.deploy == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          set -euo pipefail
          missing=0
          for name in PROD_HOST PROD_USER PROD_SSH_KEY PROD_PATH; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Update files and start Docker
        if: steps.gate.outputs.deploy == 'true'
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          port="${PROD_SSH_PORT:-22}"
          if [ -z "$port" ]; then
            port=22
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/prod
          chmod 600 ~/.ssh/prod

          if [ -n "$PROD_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_KNOWN_HOSTS" | sed 's/\\n/\n/g' > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$port" -H "$PROD_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          quoted_path="$(printf '%q' "$PROD_PATH")"
          ssh \
            -i "$HOME/.ssh/prod" \
            -p "$port" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "${PROD_USER}@${PROD_HOST}" \
            "DEPLOY_PATH=${quoted_path} DEPLOY_BRANCH=main bash -s" \
            < .github/scripts/deploy-preprod.sh
