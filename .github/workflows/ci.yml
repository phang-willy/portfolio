name: CI

on:
  push:
    branches:
      - dev
      - pre-prod
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - dev
      - pre-prod
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Front / Back quality
    runs-on: ubuntu-latest
    env:
      # Actions JS runtime (checkout/setup-node) — align with Node 24 before default switch
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "front/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Frontend lint
        working-directory: front
        run: npm run lint

      - name: Frontend type check
        working-directory: front
        run: npm run type-check

      - name: Frontend build
        working-directory: front
        run: npm run build

      - name: Backend tests
        working-directory: back
        run: mvn -B test
