name: CI

on:
  push:
    branches: [dev, pre-prod, main]
  pull_request:
    branches: [dev, pre-prod, main]

permissions:
  contents: read

jobs:
  front:
    name: Front (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: front
        run: npm ci

      - name: Lint
        working-directory: front
        run: npm run lint

      - name: Type-check
        working-directory: front
        run: npm run type-check

      - name: Test
        working-directory: front
        run: npm test

      - name: Build
        working-directory: front
        run: npm run build

  admin:
    name: Admin (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Test
        working-directory: admin
        run: npm test

      - name: Build
        working-directory: admin
        run: npm run build

  back:
    name: Back (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: portfolio
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONTACT_INTEGRATION_TEST: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/portfolio
      SPRING_DATASOURCE_USERNAME: portfolio
      SPRING_DATASOURCE_PASSWORD: portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        working-directory: back
        run: mvn -B test

  ci:
    name: Lint / Type-check / Build
    runs-on: ubuntu-latest
    needs: [front, admin, back]
    if: always()
    steps:
      - name: Require all checks
        run: |
          if [[ "${{ needs.front.result }}" != "success" ]] || \
             [[ "${{ needs.admin.result }}" != "success" ]] || \
             [[ "${{ needs.back.result }}" != "success" ]]; then
            echo "One or more CI jobs failed or were skipped."
            echo "front: ${{ needs.front.result }}"
            echo "admin: ${{ needs.admin.result }}"
            echo "back: ${{ needs.back.result }}"
            exit 1
          fi
