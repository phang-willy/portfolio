services:
  front:
    build:
      target: deps
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_CONTACT_API_ORIGIN: ${NEXT_PUBLIC_CONTACT_API_ORIGIN:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      SERVER_PORT: "3000"
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_next_cache:/app/.next

  admin:
    build:
      target: deps
    command: npm run start
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
      - admin_angular_cache:/app/.angular/cache

  back:
    build:
      target: build
    command:
      - sh
      - -c
      - |
        mkdir -p target
        find target -mindepth 1 -delete
        mvn -q -DskipTests compile || exit 1
        touch /tmp/portfolio-api-last-compile || exit 1
        (
          while true; do
            if find src pom.xml -newer /tmp/portfolio-api-last-compile | grep -q .; then
              touch /tmp/portfolio-api-last-compile;
              mvn -q -DskipTests compile;
            fi;
            sleep 2;
          done
        ) &
        exec mvn spring-boot:run
    environment:
      SERVER_PORT: "8000"
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - ./back:/workspace
      - maven_cache:/root/.m2
      - back_target:/workspace/target

volumes:
  front_node_modules:
  front_next_cache:
  admin_node_modules:
  admin_angular_cache:
  maven_cache:
  back_target:
